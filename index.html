<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>33OYUN PRO</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
body{background:#09090b;color:white}
.card:hover{transform:scale(1.07)}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="fixed inset-0 flex items-center justify-center bg-black">
<div class="bg-zinc-900 p-10 rounded-3xl text-center w-80">
<h1 class="text-4xl text-green-400 mb-6">🎮 33OYUN</h1>

<input id="loginName" placeholder="İsim" class="w-full p-3 text-black mb-2">
<input id="loginPass" type="password" placeholder="Şifre" class="w-full p-3 text-black mb-4">

<button onclick="login()" class="bg-green-500 w-full py-3">Giriş</button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden p-6">

<div class="flex justify-between mb-6">
<h2 id="welcome"></h2>
<button onclick="logout()" class="bg-red-500 px-4 py-2">Çıkış</button>
</div>

<div class="mb-6 text-xl">💰 Bakiye: <span id="balance"></span> TL</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4">

<div onclick="playRPS()" class="card bg-zinc-800 p-6 rounded-2xl text-center cursor-pointer">✊<br>RPS</div>
<div onclick="startGuess()" class="card bg-zinc-800 p-6 rounded-2xl text-center cursor-pointer">🎯<br>Guess</div>
<div onclick="playDice()" class="card bg-zinc-800 p-6 rounded-2xl text-center cursor-pointer">🎲<br>Zar</div>

<div onclick="openAdmin()" class="card bg-yellow-500 text-black p-6 rounded-2xl text-center cursor-pointer">👑<br>Admin</div>

</div>

</div>

<script>
// FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyCs4uSsIC90spXTfZNE-dLtNbfr6QOtM7g",
  authDomain: "oyun-93eb3.firebaseapp.com",
  databaseURL: "https://oyun-93eb3-default-rtdb.firebaseio.com",
  projectId: "oyun-93eb3",
  storageBucket: "oyun-93eb3.firebasestorage.app",
  messagingSenderId: "231323391433",
  appId: "1:231323391433:web:adb352e082ecfd2b720418"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("players");

let players = [];
let me = null;

// LOAD
ref.on("value", snap=>{
    players = snap.val() ? Object.values(snap.val()) : [];
});

// LOGIN
function login(){
    const n = loginName.value.trim();
    const p = loginPass.value.trim();

    let user = players.find(x=>x.name===n && x.password===p);

    if(!user){
        user={id:Date.now(),name:n,password:p,balance:100,wins:0};
        ref.child(user.id).set(user);
    }

    me=user;

    loginScreen.style.display="none";
    app.classList.remove("hidden");

    welcome.innerText="Hoşgeldin "+me.name;
    render();
}

function logout(){location.reload()}

// UPDATE
function update(){
    ref.child(me.id).update({
        balance: me.balance,
        wins: me.wins
    });
}

// UI
function render(){balance.innerText=me.balance}

// ================= OYUNLAR =================

function pay(){
    if(me.balance<10){alert("Yetersiz bakiye");return false}
    me.balance-=10; return true;
}

// RPS
function playRPS(){
    if(!pay()) return;

    const win = Math.random()>0.5;

    if(win){me.balance+=25;me.wins++;alert("Kazandın")}
    else alert("Kaybettin");

    update(); render();
}

// GUESS
function startGuess(){
    if(!pay()) return;

    let secret=Math.floor(Math.random()*20)+1;
    let hak=5;

    while(hak>0){
        let g=parseInt(prompt("1-20 tahmin ("+hak+" hak)"));
        if(g===secret){
            me.balance+=30;me.wins++;
            alert("Doğru!");
            break;
        }
        hak--;
    }

    if(hak===0) alert("Bitti sayı: "+secret);

    update(); render();
}

// DICE
function playDice(){
    if(!pay()) return;

    let t=Math.floor(Math.random()*12)+2;
    if(t>=8){me.balance+=20;me.wins++;alert("Kazandın")}
    else alert("Kaybettin");

    update(); render();
}

// ================= ADMIN =================

function openAdmin(){
    const pass=prompt("Admin şifre");
    if(pass!=="arap1905") return alert("Yanlış");

    let menu=prompt(
`1-Oyuncular
2-Oyuncu ekle
3-Sil
4-Bakiye ekle
5-Bakiye çıkar`);

    if(menu=="1"){
        let txt="";
        players.forEach(p=>txt+=p.name+" | "+p.balance+" TL\n");
        alert(txt);
    }

    if(menu=="2"){
        let n=prompt("İsim");
        let p=prompt("Şifre");

        let id=Date.now();
        ref.child(id).set({id,name:n,password:p,balance:0,wins:0});
    }

    if(menu=="3"){
        let id=prompt("Silinecek ID");
        ref.child(id).remove();
    }

    if(menu=="4"){
        let id=prompt("ID");
        let amt=parseInt(prompt("Miktar"));

        let pl=players.find(x=>x.id==id);
        if(pl){
            pl.balance+=amt;
            ref.child(pl.id).update({balance:pl.balance});
        }
    }

    if(menu=="5"){
        let id=prompt("ID");
        let amt=parseInt(prompt("Miktar"));

        let pl=players.find(x=>x.id==id);
        if(pl){
            pl.balance-=amt;
            ref.child(pl.id).update({balance:pl.balance});
        }
    }
}

</script>
</body>
</html>
