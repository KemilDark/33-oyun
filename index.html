<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>33OYUN</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
body{background:#09090b;color:white}
.card{transition:.2s}
.card:hover{transform:scale(1.05)}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginScreen" class="flex h-screen items-center justify-center">
<div class="bg-zinc-900 p-10 rounded-3xl text-center">
<h1 class="text-4xl text-green-400 mb-6">🎮 33OYUN</h1>

<input id="name" placeholder="İsim" class="p-3 text-black mb-2 w-full"><br>
<input id="pass" placeholder="Şifre" class="p-3 text-black mb-4 w-full"><br>

<button onclick="login()" class="bg-green-500 px-6 py-3 w-full">Giriş</button>
</div>
</div>

<!-- APP -->
<div id="app" class="hidden p-6">

<div class="flex justify-between mb-6">
<h2 id="welcome"></h2>
<button onclick="logout()" class="bg-red-500 px-4 py-2">Çıkış</button>
</div>

<div class="mb-6 text-xl">💰 Bakiye: <span id="balance"></span> TL</div>

<div class="grid grid-cols-2 md:grid-cols-4 gap-4">

<div onclick="playRPS()" class="card bg-zinc-800 p-6 rounded-2xl text-center cursor-pointer">
✊<br>Taş Kağıt
</div>

<div onclick="playGuess()" class="card bg-zinc-800 p-6 rounded-2xl text-center cursor-pointer">
🎯<br>Sayı
</div>

<div onclick="playDice()" class="card bg-zinc-800 p-6 rounded-2xl text-center cursor-pointer">
🎲<br>Zar
</div>

<div onclick="openAdmin()" class="card bg-yellow-500 text-black p-6 rounded-2xl text-center cursor-pointer">
👑<br>Admin
</div>

</div>
</div>

<script>
// 🔴 BURAYI SEN DOLDUR
const firebaseConfig = {
  apiKey: "BURAYA",
  authDomain: "BURAYA",
  databaseURL: "BURAYA",
  projectId: "BURAYA"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref("players");

let players = [];
let me = null;

// LOAD
ref.on("value", snap=>{
    const data = snap.val();
    players = data ? Object.values(data) : [];
});

// LOGIN
function login(){
    const n = name.value.trim();
    const p = pass.value.trim();

    let user = players.find(x=>x.name===n && x.password===p);

    if(!user){
        user={
            id: Date.now(),
            name:n,
            password:p,
            balance:100,
            wins:0
        };
        ref.child(user.id).set(user);
    }

    me=user;

    loginScreen.style.display="none";
    app.classList.remove("hidden");

    welcome.innerText="Hoşgeldin "+me.name;
    render();
}

// LOGOUT
function logout(){location.reload()}

// UPDATE
function update(){
    ref.child(me.id).update({
        balance: me.balance,
        wins: me.wins
    });
}

// UI
function render(){
    balance.innerText = me.balance;
}

// PAY
function pay(){
    if(me.balance<10){
        alert("Para yok");
        return false;
    }
    me.balance-=10;
    return true;
}

// OYUNLAR
function playRPS(){
    if(!pay()) return;

    if(Math.random()>0.5){
        me.balance+=25;
        me.wins++;
        alert("Kazandın");
    } else alert("Kaybettin");

    update(); render();
}

function playGuess(){
    if(!pay()) return;

    const s=Math.floor(Math.random()*10)+1;
    const g=parseInt(prompt("1-10"));

    if(g===s){
        me.balance+=30;
        me.wins++;
        alert("Doğru");
    } else alert("Yanlış: "+s);

    update(); render();
}

function playDice(){
    if(!pay()) return;

    const t=Math.floor(Math.random()*12)+2;

    if(t>=8){
        me.balance+=20;
        me.wins++;
        alert("Kazandın");
    } else alert("Kaybettin");

    update(); render();
}

// ADMIN
function openAdmin(){
    const pass=prompt("Admin şifre");

    if(pass!=="1234") return alert("Yanlış");

    let txt="OYUNCULAR\n\n";

    players.forEach(p=>{
        txt+=p.name+" | "+p.balance+" TL\n";
    });

    alert(txt);
}

</script>

</body>
</html>
